name: Sync Keep Activity Intelligence

on:
  workflow_dispatch:
    inputs:
      refresh_raw:
        description: 'Re-fetch all historical Keep detail responses into data/raw'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '17 22 * * *'
      timezone: 'Asia/Shanghai'

permissions:
  contents: write

concurrency:
  group: keep-sync-master
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync Keep source data
        env:
          KEEP_MOBILE: ${{ secrets.KEEP_MOBILE }}
          KEEP_PASSWORD: ${{ secrets.KEEP_PASSWORD }}
          REFRESH_RAW: ${{ inputs.refresh_raw || 'false' }}
        run: |
          if [ "$REFRESH_RAW" = "true" ]; then
            python3 sync_keep.py --refresh-raw
          else
            python3 sync_keep.py
          fi

      - name: Build personal activity intelligence
        run: python3 build_intelligence.py

      - name: Build legacy summary for compatibility
        run: python3 generate_summary.py

      - name: Validate generated context
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for p in ['data/data.json','data/agent_context.json','data/metrics/monthly.json','data/metrics/yearly.json']:
              path=Path(p)
              assert path.exists() and path.stat().st_size > 2, f'missing/empty: {p}'
              json.loads(path.read_text(encoding='utf-8'))
          print('generated data validated')
          PY

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/
          if git diff --cached --quiet; then
            echo 'no data changes'
            exit 0
          fi
          git commit -m "sync Keep activity intelligence $(date +%Y-%m-%d)"
          git pull --rebase origin master
          git push origin master
