<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#090b10" />
<title>Personal Activity Intelligence</title>
<style>
:root{--bg:#080a0f;--panel:#10141c;--panel2:#151b24;--text:#f5f7fb;--muted:#8e98a8;--line:#242b36;--accent:#8bf0c7;--accent2:#79c9ff;--warn:#ffd166;--danger:#ff8e8e}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 75% -10%,#17243c 0,transparent 33%),radial-gradient(circle at 5% 10%,#13211e 0,transparent 25%),var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1220px;margin:auto;padding:34px 20px 72px}.top{display:flex;justify-content:space-between;align-items:center;gap:18px}.brand{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}.live{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}.dot{width:8px;height:8px;border-radius:99px;background:var(--accent);box-shadow:0 0 16px var(--accent)}
h1{font-size:clamp(42px,7vw,82px);line-height:.97;letter-spacing:-.055em;margin:34px 0 18px;max-width:930px}.hero p{max-width:740px;color:var(--muted);font-size:16px;line-height:1.8;margin:0}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-top:30px}.card{background:linear-gradient(145deg,rgba(21,27,37,.96),rgba(12,16,23,.96));border:1px solid var(--line);border-radius:20px;padding:20px;overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.16)}.kpi{grid-column:span 3;min-height:148px}.wide{grid-column:span 8}.side{grid-column:span 4}.half{grid-column:span 6}.full{grid-column:1/-1}.label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}.value{font-size:40px;font-weight:720;letter-spacing:-.045em;margin-top:12px}.unit{font-size:14px;color:var(--muted);font-weight:500}.meta{margin-top:8px;color:var(--accent);font-size:12px}h2{font-size:19px;margin:0 0 7px}.sub{font-size:13px;line-height:1.7;color:var(--muted);margin-bottom:18px}.chart{width:100%;height:220px;position:relative}.bars{display:flex;height:180px;align-items:flex-end;gap:4px;border-bottom:1px solid var(--line);padding-top:14px}.bar{flex:1;min-width:5px;background:linear-gradient(to top,var(--accent),var(--accent2));border-radius:5px 5px 2px 2px;opacity:.86;position:relative}.bar:hover{opacity:1;filter:brightness(1.08)}.bar span{display:none;position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:#05070a;border:1px solid var(--line);padding:7px 9px;border-radius:9px;white-space:nowrap;font-size:11px;color:var(--text);z-index:5}.bar:hover span{display:block}.years{display:flex;justify-content:space-between;margin-top:10px;color:var(--muted);font-size:11px}.status{display:flex;gap:11px;padding:14px 0;border-bottom:1px solid var(--line)}.status:last-child{border:0}.pill{background:#1c2633;color:var(--accent2);font-size:10px;padding:5px 8px;border-radius:999px;height:max-content;letter-spacing:.05em}.status b{font-size:14px}.note{color:var(--muted);font-size:12px;line-height:1.65;margin-top:4px}.quote{font-size:25px;line-height:1.5;letter-spacing:-.025em;margin:2px 0 18px}.quote b{color:var(--accent)}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:11px 7px;text-align:left;border-bottom:1px solid var(--line)}th{font-weight:500;color:var(--muted)}.progress{width:100%;height:5px;background:#202733;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent2);border-radius:99px}.loading{padding:50px 0;color:var(--muted);text-align:center}.error{border-color:#5f3434;color:#ffb3b3}.footer{margin-top:26px;color:#566171;font-size:11px;display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap}.legend{display:flex;gap:14px;flex-wrap:wrap}.legend span{color:var(--muted);font-size:11px}.sw{display:inline-block;width:8px;height:8px;border-radius:99px;margin-right:5px;background:var(--accent)}
@media(max-width:820px){.kpi,.wide,.side,.half{grid-column:1/-1}.wrap{padding:24px 14px 60px}h1{font-size:48px}.card{border-radius:17px}.top{align-items:flex-start;flex-direction:column}.bars{gap:2px}.quote{font-size:21px}}
</style>
</head>
<body>
<main class="wrap">
  <div class="top"><div class="brand">Keep · Personal Activity Intelligence</div><div class="live"><span class="dot"></span><span id="generated">Loading live data…</span></div></div>
  <section class="hero"><h1>把运动记录，变成一条可以被理解的生命曲线。</h1><p>不是展示“你今天消耗了多少卡路里”，而是观察一个人在多年时间尺度上怎样开始、坚持、中断、重启，以及行为结构怎样悄悄发生变化。</p></section>
  <section id="dashboard" class="grid"><div class="card full loading">正在读取最新 Keep Intelligence…</div></section>
  <div class="footer"><span>事实层与解释层分离 · 原始轨迹与精确位置不会被本页面读取</span><span>Joi / keep-sync · live dashboard</span></div>
</main>
<script>
const BASE='https://raw.githubusercontent.com/psychen2019/keep-sync/master/data';
const fmt=n=>new Intl.NumberFormat('zh-CN',{maximumFractionDigits:1}).format(n??0);
const pct=n=>`${fmt(n)}%`;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function kpi(label,value,unit,meta){return `<div class="card kpi"><div class="label">${label}</div><div class="value">${value}<span class="unit"> ${unit||''}</span></div><div class="meta">${meta||''}</div></div>`}
function stat(tag,title,note){return `<div class="status"><span class="pill">${tag}</span><div><b>${title}</b><div class="note">${note}</div></div></div>`}
async function loadJSON(path){const r=await fetch(`${BASE}/${path}?v=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw new Error(`${path}: HTTP ${r.status}`);return r.json()}
function renderMonthly(monthly){const entries=Object.entries(monthly).filter(([_,v])=>v.primary).sort((a,b)=>a[0].localeCompare(b[0]));const max=Math.max(...entries.map(([_,v])=>v.primary.total_minutes||0),1);return `<div class="bars">${entries.map(([m,v])=>{const p=v.primary;const h=Math.max(2,(p.total_minutes||0)/max*100);return `<div class="bar" style="height:${h}%"><span>${m}<br>${fmt(p.total_minutes)} min · ${p.sessions} 次</span></div>`}).join('')}</div><div class="years"><span>${entries[0]?.[0]||''}</span><span>${entries[Math.floor(entries.length/2)]?.[0]||''}</span><span>${entries.at(-1)?.[0]||''}</span></div>`}
function renderYearly(yearly){const e=Object.entries(yearly).sort((a,b)=>a[0].localeCompare(b[0]));const max=Math.max(...e.map(([_,v])=>v.primary.total_minutes||0),1);return `<div class="bars">${e.map(([y,v])=>{const p=v.primary;const h=Math.max(3,(p.total_minutes||0)/max*100);return `<div class="bar" style="height:${h}%"><span>${y}<br>${fmt(p.total_minutes)} min · ${p.sessions} 次<br>中位 ${fmt(p.median_session_minutes)} min</span></div>`}).join('')}</div><div class="years">${e.map(([y])=>`<span>${y}</span>`).join('')}</div>`}
function recentRows(items){const max=Math.max(...items.map(x=>x.minutes||0),1);return items.slice(0,10).map(x=>`<tr><td>${esc((x.date||'').slice(0,10))}</td><td>${fmt(x.minutes)} min</td><td>${x.avg_hr?fmt(x.avg_hr):'—'}</td><td><div class="progress"><i style="width:${Math.max(3,(x.minutes||0)/max*100)}%"></i></div></td></tr>`).join('')}
function insight(c,y){const y25=y['2025']?.primary,y26=y['2026']?.primary;let text='你的数据已经足够形成个人时间序列，而不是只能和人口平均值比较。';if(y25&&y26){text=`2025 年记录了 <b>${y25.sessions} 次骑行</b>，单次中位数仅 ${fmt(y25.median_session_minutes)} 分钟；2026 年截至当前只有 <b>${y26.sessions} 次</b>，但单次中位数跃升到 <b>${fmt(y26.median_session_minutes)} 分钟</b>。这提示“次数”与“完整训练”可能正在分离。`;}
return text}
async function main(){try{const [c,m,y]=await Promise.all([loadJSON('agent_context.json'),loadJSON('metrics/monthly.json'),loadJSON('metrics/yearly.json')]);document.getElementById('generated').textContent=`Live · ${new Date(c.generated_at).toLocaleString('zh-CN',{hour12:false})}`;const all=c.all_time||{},p=all.primary||{},w=c.windows||{},state=c.current_state||{},base=c.personal_baseline||{};document.getElementById('dashboard').innerHTML=
 kpi('全部活动',all.all?.sessions||0,'次',`${all.first_activity_date||'—'} → now`)+
 kpi('动感单车',p.sessions||0,'次',`${pct((p.sessions||0)/(all.all?.sessions||1)*100)} of sessions`)+
 kpi('累计骑行',fmt((p.total_minutes||0)/60),'小时',`${fmt(p.total_minutes)} minutes`)+
 kpi('距上次骑行',state.days_since_primary_activity??'—','天',state.latest_primary_activity?.date?.slice(0,10)||'No data')+
 `<div class="card wide"><h2>年度骑行演化</h2><div class="sub">看长期结构：不是“有没有运动”，而是运动行为怎样在几年里聚集、消散、重新成形。</div>${renderYearly(y)}</div>`+
 `<div class="card side"><h2>当前状态</h2><div class="sub">这里坚持只放事实与描述性统计。</div>${stat('30 DAYS',`${w['30']?.primary?.sessions||0} 次骑行`,`${fmt(w['30']?.primary?.total_minutes||0)} 分钟`)}${stat('365 DAYS',`${w['365']?.primary?.sessions||0} 次骑行`,`${fmt(w['365']?.primary?.total_minutes||0)} 分钟 · 单次中位 ${fmt(w['365']?.primary?.median_session_minutes)} 分钟`)}${stat('BASELINE',`${fmt(base.active_month_median_sessions)} 次 / 活跃月`,`${fmt(base.active_month_median_minutes)} 分钟 / 活跃月 · 个人描述性基线`)}</div>`+
 `<div class="card full"><h2>月度脉冲</h2><div class="sub">每根柱子是一月的动感单车总分钟数。悬停可以看具体月份、次数和分钟。</div>${renderMonthly(m)}</div>`+
 `<div class="card half"><h2>最近骑行</h2><div class="sub">最近 10 条 Primary Activity。这里只读 Agent Context，不接触 GPS 与 raw。</div><table><thead><tr><th>日期</th><th>时长</th><th>平均 HR</th><th>相对时长</th></tr></thead><tbody>${recentRows(c.recent_primary_sessions||[])}</tbody></table></div>`+
 `<div class="card half"><h2>Joi · Signal</h2><div class="sub">这是解释层：提示值得继续验证的结构，不冒充事实。</div><p class="quote">${insight(c,y)}</p>${stat('NOW',`${state.days_since_primary_activity??'—'} 天未骑`,state.latest_primary_activity?`最近一次 ${state.latest_primary_activity.date.slice(0,10)} · ${fmt(state.latest_primary_activity.minutes)} 分钟`:'无最近记录')}${stat('GAP',`历史最长骑行间隔 ${all.primary_longest_gap_days??'—'} 天`,'长间隔说明“中断”本身就是这条行为曲线的一部分。')}${stat('QUESTION','什么条件让完整 session 出现？','下一步应把短 session 与 30–50 分钟完整 session 下钻到 normalized/raw 对照。')}</div>`+
 `<div class="card full"><h2>Data Integrity</h2><div class="legend"><span><i class="sw"></i>页面只读取 agent_context + monthly/yearly</span><span>HR 历史覆盖并不完整</span><span>不把因果猜测写回事实层</span><span>不是医疗诊断页面</span></div></div>`;
}catch(e){document.getElementById('dashboard').innerHTML=`<div class="card full error"><h2>数据加载失败</h2><div class="note">${esc(e.message)}。如果刚刚完成部署，GitHub CDN 可能还没刷新。</div></div>`;document.getElementById('generated').textContent='Data unavailable';}}
main();
</script>
</body>
</html>
